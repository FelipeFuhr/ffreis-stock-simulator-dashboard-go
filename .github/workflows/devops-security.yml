name: DevOps / Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  schedule:
    - cron: "23 9 24 * *"  # monthly scattered (was: 0 6 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-fs:
    permissions:
      contents: read
      actions: read
      security-events: write
    # Consolidated fs-security bundle: Trivy(fs) + Grype(fs) + gitleaks in ONE job
    # (was 3 separate jobs). upload-sarif off: GHAS/code-scanning not enabled.
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-security-fs.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      working-directory: "."
      scan-history: true
      upload-sarif: false
  codeql:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      languages: "go"
      source-root: "."

  govulncheck:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-security.yml@2253ff2eda0a3d65f9eaca1a3ae117d32a449e20 # v1.2.0
    with:
      go-version: "1.25.8"
      working-directory: "."

  semgrep:
    permissions:
      contents: read
      # scan-fix(startup_failure): callee go-semgrep-sarif.yml also requires
      # actions: read.
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-semgrep-sarif.yml@2253ff2eda0a3d65f9eaca1a3ae117d32a449e20 # v1.2.0
    with:
      working-directory: "."
      upload-sarif: false

  osv:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-osv-scanner.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      working-directory: "."
      upload-sarif: false

  snyk:
    # Gate via repo variable (vars.SNYK_ENABLED). The `secrets` context is not
    # available in job-level `if:` — using it triggers a startup_failure.
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    permissions:
      contents: read
      # scan-fix(startup_failure): callee go-snyk.yml also requires
      # actions: read.
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-snyk.yml@2253ff2eda0a3d65f9eaca1a3ae117d32a449e20 # v1.2.0
    with:
      working-directory: "."
      upload-sarif: false
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

