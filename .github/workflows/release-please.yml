name: DevOps / Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      # scan-fix(startup_failure): callee general-release-please.yml also
      # requires issues: write.
      issues: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-release-please.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
