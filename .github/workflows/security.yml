name: Dependency Security (govulncheck)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "55 19 7 * *"  # monthly scattered (was: 0 9 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-security.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      # scan-fix(govulncheck): bumped 1.21 -> 1.25.13 to match go.mod
      # toolchain; govulncheck-action reads this input, not go.mod.
      go-version: "1.25.13"

