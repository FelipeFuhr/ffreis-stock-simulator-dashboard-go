name: Semgrep (SAST)

on:
  workflow_dispatch:
  schedule:
    - cron: "48 6 25 * *"  # monthly scattered (was: 0 8 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-semgrep.yml@2253ff2eda0a3d65f9eaca1a3ae117d32a449e20 # v1.2.0

