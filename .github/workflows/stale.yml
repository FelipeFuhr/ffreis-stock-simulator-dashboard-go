name: DevOps / Stale

on:
  schedule:
    - cron: "1 12 21 * *"  # monthly scattered (was: 0 6 * * 1)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale:
    permissions:
      # scan-fix(startup_failure): callee general-stale.yml also requires
      # contents: read.
      contents: read
      issues: write
      pull-requests: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-stale.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      only: "both"
